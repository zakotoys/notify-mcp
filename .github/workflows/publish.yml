name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm Trusted Publishing requires a recent npm CLI.
      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $package_version"
            exit 1
          fi

      - name: Run release checks
        run: npm run ci

      - name: Publish package with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release and changelog
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
